# Ensure TUN support is baked with the image for VPN stacks. The package
# selector enables the matching kernel symbol in OpenWrt's kernel config.
CONFIG_PACKAGE_kmod-tun=y
# Conservative inclusion for OpenVPN data path support on many targets
CONFIG_PACKAGE_kmod-ovpn-dco-v2=n
# APK treats these virtual 'ip' providers as conflicting packages. Mega's QMI
# handoff needs ip-full JSON output; do not also install the board's ip-tiny.
CONFIG_PACKAGE_ip-tiny=n
