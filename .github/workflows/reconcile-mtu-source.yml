name: Reconcile and validate MTU source
on:
  push:
    branches: [qmodem-mtu-config-20260916]
    paths: ['.github/workflows/reconcile-mtu-source.yml']
permissions:
  contents: write
jobs:
  reconcile:
    if: github.repository == 'mfoster978/OpenWrt-ZBT-Z8803BE-Mega'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends busybox jq patch ripgrep gcc nftables iproute2 python3 conntrack iptables
      - name: Apply hash-guarded reconciliation on review branch only
        run: |
          test "$GITHUB_REF" = refs/heads/qmodem-mtu-config-20260916
          python3 tools/reconcile-mtu-source-20260916.py
      - name: Test MTU and unchanged QMI lifecycle
        run: node --test firmware/tests/qmi-session.test.cjs firmware/tests/qmi-mtu*.test.cjs
      - name: Validate firmware inputs
        run: bash firmware/scripts/check-build-inputs.sh
      - name: Validate pinned patches and all known cached builds
        run: node firmware/tests/check-patches.cjs
      - name: Commit validated reconciliation to review branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/docker/build-openwrt.sh firmware/scripts/check-build-inputs.sh firmware/tests/check-patches.cjs firmware/docs/per-modem-mtu.md
          git commit -m 'Preserve incoming MTU defaults and migrate all known QModem build caches safely'
          git push origin HEAD:refs/heads/qmodem-mtu-config-20260916
          git rev-parse HEAD
