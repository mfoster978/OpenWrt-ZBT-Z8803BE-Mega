name: Prepare LAN IPv6 guard
# Final validation-only pass; temporary workflow is removed before merge.
on:
  push:
    branches: [lan-ipv6-guard-20260916]
    paths: ['.github/workflows/prepare-lan-ipv6-guard.yml']
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'mfoster978/OpenWrt-ZBT-Z8803BE-Mega'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends busybox jq patch ripgrep gcc nftables iproute2 python3 conntrack iptables
      - name: Run focused IPv6 guard and existing QMI MTU tests
        run: node --test firmware/tests/lan-ipv6-guard.test.cjs firmware/tests/qmi-mtu*.test.cjs
      - name: Validate firmware inputs
        run: bash firmware/scripts/check-build-inputs.sh
      - name: Validate pinned QModem patch stack and cached builds
        run: node firmware/tests/check-patches.cjs
