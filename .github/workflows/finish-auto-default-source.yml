name: Finish LAN IPv6 Auto default source
on:
  push:
    branches: [default-lan-ipv6-auto-20260916]
    paths: ['.github/workflows/finish-auto-default-source.yml']
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install BusyBox used by focused tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends busybox
      - name: Update consistency checks and regression expectations
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/default-lan-ipv6-auto-20260916
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              Path('firmware/scripts/check-build-inputs.sh'): [
                  ("grep -Fq 'lan_ipv6_policy=manual' firmware/files/usr/sbin/zbt-qmodem-profile",
                   "grep -Fq 'lan_ipv6_policy=auto' firmware/files/usr/sbin/zbt-qmodem-profile"),
              ],
              Path('firmware/tests/lan-ipv6-guard.test.cjs'): [
                  ("test('manual policy is the safe default and never changes LAN IPv6'",
                   "test('explicit manual policy preserves LAN IPv6 without changes'"),
                  ("assert.equal(option.default, 'manual');",
                   "assert.equal(option.default, 'auto');"),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if text.count(old) != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, got {text.count(old)}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          grep -Fq 'lan_ipv6_policy=auto' firmware/files/usr/sbin/zbt-qmodem-profile
          grep -Fq "o.default = 'auto';" firmware/patches/qmodem-lan-ipv6-v18.patch
          ! grep -Fq "o.default = 'manual';" firmware/patches/qmodem-lan-ipv6-v18.patch
          git diff --check
      - name: Focused LAN IPv6 guard regression test
        run: node --test firmware/tests/lan-ipv6-guard.test.cjs
      - name: Source consistency checks
        run: bash firmware/scripts/check-build-inputs.sh
      - name: Commit source-only consistency changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/scripts/check-build-inputs.sh firmware/tests/lan-ipv6-guard.test.cjs
          git commit -m 'Keep LAN IPv6 Auto default checks and tests in sync'
          git push origin HEAD:refs/heads/default-lan-ipv6-auto-20260916
