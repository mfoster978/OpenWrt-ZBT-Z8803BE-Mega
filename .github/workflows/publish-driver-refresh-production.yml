name: Publish Driver Refresh Production Release

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-driver-refresh-production.yml'

permissions:
  contents: write

concurrency:
  group: publish-driver-refresh-production
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENWRT_ROOT: /workspace/openwrt
      OPENWRT_GIT_URL: https://github.com/0xFar5eer/openwrt25.12_ZBT_Z8803BE.git
      OPENWRT_GIT_REF: v25.12.021
      ALLOW_CLONE_OPENWRT: "1"
      CUSTOM_FEED_DIR: /workspace/firmware/feeds
      FILES_OVERLAY_DIR: /workspace/firmware/files
      PROFILE_PACKAGES_FILE: /workspace/firmware/profiles/packages-default.txt
      PROFILE_KCONFIG_FILE: /workspace/firmware/profiles/kconfig-fragment.conf
      TARGET: mediatek/filogic
      SUBTARGET: filogic
      DEVICE: zbtlink_zbt-z8803be
      FINAL_MAKE_JOBS: "2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Allocate production version
        run: echo "MEGA_RELEASE_VERSION=firmware-$(date -u +%Y%m%d%H%M).${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Validate source and driver refresh
        run: |
          bash firmware/scripts/check-build-inputs.sh
          node --test firmware/tests/driver-refresh.test.cjs

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost
          sudo apt-get clean
          docker system prune --all --force
          available_kb="$(df --output=avail -k / | tail -n 1 | tr -d ' ')"
          [ "$available_kb" -ge 41943040 ] || { echo 'Less than 40 GiB free' >&2; exit 1; }

      - name: Build remote builder image
        run: docker build -f firmware/docker/Dockerfile.remote-builder -t owrt-remote-builder .

      - name: Build production driver-refresh firmware
        run: |
          set -o pipefail
          docker run --rm \
            -e OPENWRT_ROOT \
            -e OPENWRT_GIT_URL \
            -e OPENWRT_GIT_REF \
            -e ALLOW_CLONE_OPENWRT \
            -e CUSTOM_FEED_DIR \
            -e FILES_OVERLAY_DIR \
            -e PROFILE_PACKAGES_FILE \
            -e PROFILE_KCONFIG_FILE \
            -e TARGET \
            -e SUBTARGET \
            -e DEVICE \
            -e FINAL_MAKE_JOBS \
            -e MEGA_RELEASE_VERSION \
            -v "${PWD}:/workspace" \
            owrt-remote-builder \
            bash /workspace/firmware/docker/build-openwrt-driver-refresh.sh

      - name: Collect and validate release assets
        run: |
          set -euo pipefail
          release_dir=artifacts/release-assets
          target_dir=openwrt/bin/targets/mediatek/filogic
          asset_prefix=OpenWrt-Mega-Edition-ZBT-Z8803BE
          mkdir -p "$release_dir"
          initramfs="$(find "$target_dir" -maxdepth 1 -type f -name '*zbt-z8803be-initramfs-kernel.bin' -print -quit)"
          sysupgrade="$(find "$target_dir" -maxdepth 1 -type f -name '*zbt-z8803be-squashfs-sysupgrade.bin' -print -quit)"
          package_manifest="$(find "$target_dir" -maxdepth 1 -type f -name '*zbt-z8803be.manifest' -print -quit)"
          [ -n "$initramfs" ] && [ -n "$sysupgrade" ] && [ -n "$package_manifest" ]
          versioned_initramfs="${asset_prefix}-initramfs-${MEGA_RELEASE_VERSION}.bin"
          versioned_sysupgrade="${asset_prefix}-sysupgrade-${MEGA_RELEASE_VERSION}.bin"
          versioned_packages="${asset_prefix}-packages-${MEGA_RELEASE_VERSION}.manifest"
          cp "$initramfs" "$release_dir/$versioned_initramfs"
          cp "$sysupgrade" "$release_dir/$versioned_sysupgrade"
          cp "$package_manifest" "$release_dir/$versioned_packages"
          cp "$sysupgrade" "$release_dir/${asset_prefix}-sysupgrade.bin"
          cp "$sysupgrade" "$release_dir/openwrt-mediatek-filogic-zbtlink_zbt-z8803be-squashfs-sysupgrade.bin"
          cp firmware/scripts/verify-router-runtime.sh "$release_dir/"
          cp "$target_dir/zbt-mega-build.json" "$release_dir/zbt-mega-build.json"
          python3 firmware/scripts/mega-release.py manifest \
            --identity "$target_dir/zbt-mega-build.json" \
            --image "$release_dir/$versioned_sysupgrade" \
            --version "$MEGA_RELEASE_VERSION" \
            --source-sha "$GITHUB_SHA" \
            --output "$release_dir/mega-release-v2.json"
          {
            echo "Recipe commit: $GITHUB_SHA"
            echo "OpenWrt source: $OPENWRT_GIT_URL"
            echo "OpenWrt ref: $OPENWRT_GIT_REF"
            echo "OpenWrt commit: $(git -C openwrt rev-parse HEAD)"
            echo "Target: $TARGET"
            echo "Device: $DEVICE"
            echo "Edition: Mega"
            echo "Version: $MEGA_RELEASE_VERSION"
            echo "Driver refresh: mt76 be5ce7910521492d4a2e4ce7ee3843680a46c047"
            echo "QMI backport: 55f854dd5bdd8e19b936a00ef1f8d776ac32c7b0"
          } > "$release_dir/BUILD-INFO.txt"
          (cd "$release_dir" && sha256sum -- *.bin > SHA256SUMS)
          cat > "$release_dir/RELEASE_NOTES.md" <<EOF
          ## Driver refresh release

          This release promotes the tested ZBT-Z8803BE driver-refresh build to the normal public Mega Edition release channel.

          - Updates MT7996/mt76 to the September 2026 source used by the tested image.
          - Backports the qmi_wwan RX URB/max-MTU fix while keeping both RM551E-GL modems in QMI mode.
          - Keeps Linux 6.12.74, existing Mega MLO/hostapd fixes, watchdog recovery, MultiWAN and Speedify support.
          - Does not update RM551E modem firmware.

          Hardware boot, Wi-Fi startup and both QMI modem interfaces were verified on the ZBT-Z8803BE before promotion. Ongoing modem-drop and MLO transmit-power investigation remains separate from this release.
          EOF

      - name: Publish public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$MEGA_RELEASE_VERSION" artifacts/release-assets/* \
            --target "$GITHUB_SHA" \
            --title "OpenWrt Mega Edition — ${MEGA_RELEASE_VERSION}" \
            --notes-file artifacts/release-assets/RELEASE_NOTES.md \
            --latest

      - name: Upload release artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: production-driver-refresh-${{ github.run_number }}
          path: artifacts/release-assets
          if-no-files-found: error
          retention-days: 14
